<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Farmashia | الفرمشية - Premium Healthcare Products</title>
    
    <!-- Preconnect & Preload Google Fonts to eliminate FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;600;700;800&family=Changa:wght@700;800&family=Readex+Pro:wght@400;600;700;800&family=Bebas+Neue&family=Oswald:wght@700;800&family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap"
    />

    <style>
      /* Initial zero-delay splash loader - Light Theme */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #0f766e;
        font-family: 'Almarai', system-ui, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .pill-container {
        position: relative;
        width: 64px;
        height: 32px;
        border-radius: 999px;
        background: linear-gradient(135deg, #14b8a6 50%, #0d9488 50%);
        border: 2px solid rgba(20, 184, 166, 0.3);
        box-shadow: 0 10px 25px rgba(20, 184, 166, 0.25);
        animation: pillPulse 1.4s ease-in-out infinite alternate;
      }
      .pill-glow {
        position: absolute;
        inset: -12px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(20,184,166,0.18) 0%, rgba(255,255,255,0) 70%);
        animation: glowPulse 1.4s ease-in-out infinite alternate;
      }
      @keyframes pillPulse {
        0% { transform: scale(0.94) rotate(-4deg); }
        100% { transform: scale(1.06) rotate(4deg); }
      }
      @keyframes glowPulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
      .loader-title {
        margin-top: 20px;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: #0f766e;
      }
      .loader-sub {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div style="position: relative;">
          <div class="pill-glow"></div>
          <div class="pill-container"></div>
        </div>
        <div class="loader-title">الفرماشية | Al-Farmashia</div>
        <div class="loader-sub">جاري التحميل...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
